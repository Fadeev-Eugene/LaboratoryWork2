name: C++ CI with SFML

on: [push, pull_request]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Add SFML PPA
      run: |
        sudo apt-get update
        sudo apt-get install -y software-properties-common
        sudo add-apt-repository -y ppa:sonkun/sfml-stable
        sudo apt-get update

    - name: Install dependencies
      run: |
        sudo apt-get install -y \
          build-essential \
          cmake \
          libsqlite3-dev \
          libsfml-dev \
          googletest

    - name: Build Google Test
      run: |
        cd /usr/src/googletest
        sudo cmake .
        sudo make
        sudo make install

    - name: Build project
      run: |
        make
        ls -R app

    - name: Verify installation
      run: |
        # Проверка установки SFML
        echo "SFML version:"
        pkg-config --modversion sfml-system || echo "SFML not found"
        echo ""
        
        # Проверка ресурсов
        echo "Copied assets:"
        ls -l app
